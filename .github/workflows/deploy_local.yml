name: Auto Rebuild on Local Windows PC

on:
  push:
    branches:
      - main

jobs:
  rebuild-local:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stop Running Server Process (Port 8001)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          Write-Host "Stopping any running server on Port 8001 to release file locks..."
          $connections = Get-NetTCPConnection -LocalPort 8001 -ErrorAction SilentlyContinue
          if ($connections) {
              foreach ($conn in $connections) {
                  $procId = $conn.OwningProcess
                  if ($procId -gt 0) {
                      Write-Host "Terminating process ID: $procId"
                      Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue
                  }
              }
          }

      - name: Build React Frontend
        shell: powershell
        working-directory: ./frontend
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & npm.cmd install
          & npm.cmd run build

      - name: Sync Dist to Backend
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          if (-not (Test-Path "backend\dist")) {
              New-Item -ItemType Directory -Path "backend\dist" -Force
          }
          Copy-Item -Path "frontend\dist\*" -Destination "backend\dist\" -Recurse -Force

      - name: Update Backend Dependencies
        shell: powershell
        working-directory: ./backend
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          if (-not (Test-Path ".venv\Scripts\python.exe")) {
              python -m venv .venv
          }
          & ".\.venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Complete Build
        shell: powershell
        run: |
          Write-Host "======================================================="
          Write-Host "[SUCCESS] Frontend rebuilt & synced to backend/dist!"
          Write-Host "======================================================="
