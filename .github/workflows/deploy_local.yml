name: Auto Rebuild on Local Windows PC

on:
  push:
    branches:
      - main

jobs:
  rebuild-local:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build React Frontend
        shell: powershell
        run: |
          Set-Location frontend
          npm install
          npm run build

      - name: Sync Dist to Backend
        shell: powershell
        run: |
          if (-not (Test-Path "backend\dist")) {
              New-Item -ItemType Directory -Path "backend\dist" -Force
          }
          Copy-Item -Path "frontend\dist\*" -Destination "backend\dist\" -Recurse -Force

      - name: Update Backend Dependencies
        shell: powershell
        run: |
          if (-not (Test-Path "backend\.venv\Scripts\python.exe")) {
              python -m venv backend\.venv
          }
          & "backend\.venv\Scripts\python.exe" -m pip install -r backend\requirements.txt

      - name: Restart Server Process on Port 8001
        shell: powershell
        run: |
          Write-Host "Checking for active backend process on Port 8001..."
          $connections = Get-NetTCPConnection -LocalPort 8001 -ErrorAction SilentlyContinue
          if ($connections) {
              foreach ($conn in $connections) {
                  $procId = $conn.OwningProcess
                  if ($procId -gt 0) {
                      Write-Host "Terminating process ID: $procId"
                      Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue
                  }
              }
          }
          Write-Host "Successfully rebuilt frontend dist & updated backend dependencies."
